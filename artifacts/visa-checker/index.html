    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I check if I need a visa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Select your passport country and your destination country on isvisarequired.com. We instantly show whether you need a visa, can get a visa on arrival, apply for an e-visa, or travel visa-free. We cover 195 passports and 195 destinations."
          }
        },
        {
          "@type": "Question",
          "name": "What is a visa on arrival?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A visa on arrival means you can get your visa when you arrive at the destination country's airport or border — you do not need to apply in advance. The process usually takes minutes and involves paying a small fee at the immigration counter."
          }
        },
        {
          "@type": "Question",
          "name": "What is an e-visa or electronic visa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An e-visa (electronic visa) is a visa you apply for and receive online before you travel. You do not need to visit an embassy. Common examples include the US ESTA, the UK ETA, India e-Visa, and Kenya e-Visa."
          }
        },
        {
          "@type": "Question",
          "name": "Which passport gives the most visa-free access?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As of 2026, passports from Denmark, Spain, Sweden and the United Arab Emirates offer the broadest access, each reaching 180 of the 194 other destinations in our dataset without arranging a visa in advance. Other EU passports are close behind. See the full ranking in our Passport Power Report."
          }
        },
        {
          "@type": "Question",
          "name": "Which passport has the most restrictions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Afghan, Syrian, and Somali passports currently have the most travel restrictions, with citizens able to access fewer than 80 countries without requiring a visa in advance."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a visa to travel to the USA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your passport. Citizens of many countries including the UK, Germany, France, Japan, and Australia can travel to the USA under the Visa Waiver Program by completing an ESTA (Electronic System for Travel Authorization) online. Citizens of other countries need to apply for a US visa at an embassy or consulate."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a visa to visit Europe / the Schengen Area?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Access to the Schengen Area (26 European countries) is visa-free for citizens of many countries including the USA, Canada, Australia, Japan, and South Korea for up to 90 days. Citizens of other countries need to apply for a Schengen visa. Starting 2025, most visa-free travelers also need to register with the ETIAS system before entry."
          }
        },
        {
          "@type": "Question",
          "name": "Is isvisarequired.com free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, isvisarequired.com is completely free to use. Simply select your passport and destination to instantly check visa requirements, processing information, and travel highlights."
          }
        }
      ]
    }
    </script>
